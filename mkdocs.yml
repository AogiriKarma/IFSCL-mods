site_name: IFSCL Mods
site_url: https://aogirikarma.github.io/IFSCL-mods/
repo_url: https://github.com/AogiriKarma/IFSCL-mods
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: slate
      primary: teal
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
nav:
  - Accueil: index.md
  - Internals:
      - Démarrage du jeu: internals/boot.md
      - Traductions: internals/translations.md
